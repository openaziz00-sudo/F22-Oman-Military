<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071923">
<title>صقور عُمان | Air Combat</title>
<style>
:root{--gold:#d7b66b;--glass:rgba(5,18,27,.68);--line:rgba(210,231,232,.2)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071923;color:#eff7f4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;z-index:2}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand,.stats,.help{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px #0003}.brand strong{display:block;color:var(--gold);letter-spacing:1px;font-size:14px}.brand small{color:#a8bfbd;font-size:10px;letter-spacing:2px}.stats{display:flex;gap:18px;direction:rtl}.stat span{display:block;color:#9db5b4;font-size:10px}.stat b{font-size:18px;font-variant-numeric:tabular-nums}.health{width:120px;height:6px;background:#314449;border-radius:8px;margin-top:5px;overflow:hidden}.health i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#d65d4d,#e4c66e);transition:width .2s}.bottom{position:absolute;bottom:18px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}.hint{background:var(--glass);border:1px solid var(--line);padding:9px 12px;border-radius:12px;color:#c1d1ce;font-size:11px;max-width:250px}.fire{pointer-events:auto;border:1px solid #f2d58d;background:linear-gradient(145deg,#c79b43,#755426);color:white;font-weight:800;border-radius:50%;width:82px;height:82px;box-shadow:0 0 28px #d4aa4b55;touch-action:none;font-size:13px}.fire:active{transform:scale(.95);filter:brightness(1.2)}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(145deg,#06131ceF,#0b2935df);backdrop-filter:blur(8px);padding:24px}#overlay.hidden{display:none}.panel{width:min(460px,100%);padding:28px;border:1px solid #c9b16b55;border-radius:22px;background:linear-gradient(145deg,#102b35,#081a24);text-align:center;box-shadow:0 30px 100px #0008}.crest{font-size:38px;color:var(--gold)}h1{margin:5px 0;color:#f0d38c;font-size:27px}p{color:#b4c9c6;line-height:1.7;font-size:14px}.primary{border:0;border-radius:12px;background:linear-gradient(90deg,#d7b66b,#a77a37);color:#111c20;font-weight:900;padding:14px 24px;font-size:15px;width:100%;margin-top:12px}.secondary{border:1px solid #8aa5a2;background:transparent;color:#e5efec;border-radius:10px;padding:10px 16px;margin-top:10px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:11px;color:#9fb5b1;margin-top:16px}.controls span{border:1px solid #ffffff22;border-radius:7px;padding:5px 8px}#toast{position:fixed;z-index:4;top:90px;left:50%;transform:translateX(-50%);background:#102b35dd;border:1px solid var(--gold);border-radius:20px;padding:8px 16px;color:#f5d88e;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none}#toast.show{opacity:1}#crosshair{position:fixed;left:50%;top:44%;width:30px;height:30px;transform:translate(-50%,-50%);border:1px solid #e7d18c88;border-radius:50%;pointer-events:none;z-index:1}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#e7d18c88}#crosshair:before{width:1px;height:44px;left:14px;top:-8px}#crosshair:after{height:1px;width:44px;top:14px;left:-8px}
@media(max-width:600px){.top{top:8px;left:8px;right:8px}.brand{padding:8px 10px}.stats{gap:10px;padding:8px 10px}.stat b{font-size:15px}.health{width:82px}.bottom{bottom:12px;left:10px;right:10px}.hint{max-width:190px;font-size:10px}.fire{width:72px;height:72px}}
</style></head><body>
<div id="hud"><div class="top"><div class="brand"><strong>صُقور عُمان</strong><small>ROYAL AIR DEFENCE • FLIGHT SIM</small></div><div class="stats"><div class="stat"><span>النقاط</span><b id="score">00000</b></div><div class="stat"><span>الموجة</span><b id="wave">01</b></div><div class="stat"><span>الصحة</span><b id="hpText">100%</b><div class="health"><i id="hpBar"></i></div></div></div></div><div id="crosshair"></div><div class="bottom"><div class="hint" id="hint">حرّك الهاتف للتوجيه أو اسحب الشاشة. اضغط مطولاً لإطلاق النار.</div><button class="fire" id="fire">إطلاق<br>النار</button></div></div>
<div id="toast"></div><div id="overlay"><div class="panel"><div class="crest">✦</div><h1 id="title">صقور عُمان</h1><p id="desc">مهمة دفاع جوي فوق بحر عُمان. قُد الطائرة، واجه أسراب المقاتلات المعادية، وحافظ على سلامة طائرتك.</p><button class="primary" id="start">ابدأ المهمة</button><button class="secondary" id="motion">تفعيل تحكم حركة الهاتف</button><div class="controls"><span>سحب الشاشة: توجيه</span><span>WASD / الأسهم</span><span>Space: إطلاق</span></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);const scene=new THREE.Scene();scene.background=new THREE.Color(0x8db9c5);scene.fog=new THREE.Fog(0x8db9c5,90,430);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);camera.position.set(0,5,13);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9f2ff,0x536c4d,2));const sun=new THREE.DirectionalLight(0xffe2b2,2.5);sun.position.set(-40,70,25);sun.castShadow=true;scene.add(sun);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200,1,1),new THREE.MeshStandardMaterial({color:0x176b83,roughness:.48,metalness:.18}));sea.rotation.x=-Math.PI/2;sea.position.y=-8;scene.add(sea);
// Layered distant haze and sun
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(8,24,16),new THREE.MeshBasicMaterial({color:0xffe0a3}));sunBall.position.set(-110,85,-310);scene.add(sunBall);
// User-supplied detailed city pack replaces the procedural islands.
const cityInstances=[];let cityTemplate=null;const cityLoader=new GLTFLoader();
cityLoader.load('./assets/city_pack_5.glb',g=>{
  cityTemplate=g.scene;const bounds=new THREE.Box3().setFromObject(cityTemplate),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
  cityTemplate.position.sub(center);const fitScale=0.82/Math.max(size.x/54,size.z/55);cityTemplate.scale.setScalar(fitScale);
  cityTemplate.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();o.material.roughness=Math.max(.58,o.material.roughness??.7)}}});
  const centeredMinY=bounds.min.y-center.y,groundY=-7.5-centeredMinY*fitScale;
  for(let i=0;i<8;i++){const inst=new THREE.Group();inst.add(cityTemplate.clone(true));inst.position.set((i%2===0?-1:1)*(42+(i%3)*17),groundY,-95-i*105);scene.add(inst);cityInstances.push(inst)}
},undefined,e=>{console.error('City GLB load failed',e);toast('تعذر تحميل حزمة المدينة؛ تحقق من وجود الملف داخل assets.');});
// Cloud clusters
for(let i=0;i<42;i++){let group=new THREE.Group();let x=(Math.random()-.5)*300,y=22+Math.random()*48,z=-Math.random()*400;for(let j=0;j<4;j++){let m=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*3,10,8),new THREE.MeshBasicMaterial({color:0xe5f0ec,transparent:true,opacity:.22}));m.position.set(j*2.5,Math.random()*2,Math.random()*2);group.add(m)}group.position.set(x,y,z);scene.add(group)}
const player=new THREE.Group();player.position.set(0,2,0);scene.add(player);let aircraft=null;const loader=new GLTFLoader();let modelReady=false;
loader.load('./assets/f22_oman.glb',g=>{aircraft=g.scene;const box=new THREE.Box3().setFromObject(aircraft),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());aircraft.position.sub(center);const max=Math.max(size.x,size.y,size.z);aircraft.scale.setScalar(6.8/max);aircraft.rotation.y=Math.PI;aircraft.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material= o.material.clone();o.material.roughness=Math.max(.42,o.material.roughness??.6)}}});player.add(aircraft);modelReady=true;},undefined,e=>{console.error('Aircraft GLB load failed',e);toast('تعذر تحميل نموذج الطائرة؛ تحقق من تشغيل اللعبة عبر خادم محلي.');});
// Engine glow
for(const x of [-.65,.65]){let glow=new THREE.Mesh(new THREE.SphereGeometry(.16,12,8),new THREE.MeshBasicMaterial({color:0x66dfff}));glow.position.set(x,-.05,.85);player.add(glow)}
const bullets=[],enemies=[],particles=[];let running=false,score=0,hp=100,wave=1,spawnTimer=1.5,fireTimer=0,elapsed=0,damageFlash=0;let aimX=0,aimY=0,fireHeld=false,motionEnabled=false,orientation={x:0,y:0};
const matBullet=new THREE.MeshBasicMaterial({color:0x9ef4ff});function shoot(){const b=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),matBullet);b.position.copy(player.position).add(new THREE.Vector3(0,0,-2.5));b.userData={vel:new THREE.Vector3(aimX*.5,aimY*.5,-95)};scene.add(b);bullets.push(b)}
function enemy(){const group=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(.9,3.7,5),new THREE.MeshStandardMaterial({color:0x5b6870,metalness:.55,roughness:.5}));body.rotation.x=-Math.PI/2;group.add(body);const wing=new THREE.Mesh(new THREE.BoxGeometry(4.5,.12,1.2),new THREE.MeshStandardMaterial({color:0x394a51,metalness:.4}));group.add(wing);group.position.set((Math.random()-.5)*34,Math.random()*7-1,-100-Math.random()*35);group.rotation.y=Math.PI;group.userData={speed:18+wave*1.5,hp:2,phase:Math.random()*6.28,fire:2+Math.random()*2};scene.add(group);enemies.push(group)}
function burst(pos,color=0xffa64d){for(let i=0;i<22;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.12+Math.random()*.13,6,5),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);m.userData={v:new THREE.Vector3((Math.random()-.5)*13,Math.random()*12,(Math.random()-.5)*13),life:.65+Math.random()*.6};scene.add(m);particles.push(m)}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function updateHud(){$('score').textContent=String(score).padStart(5,'0');$('wave').textContent=String(wave).padStart(2,'0');$('hpText').textContent=hp+'%';$('hpBar').style.width=hp+'%'}
function reset(){for(const a of [...bullets,...enemies,...particles])scene.remove(a);bullets.length=enemies.length=particles.length=0;score=0;hp=100;wave=1;spawnTimer=1;elapsed=0;player.position.set(0,2,0);player.rotation.set(0,0,0);updateHud()}
function gameOver(){running=false;fireHeld=false;$('title').textContent='انتهت المهمة';$('desc').textContent=`النتيجة: ${score} نقطة — وصلت إلى الموجة ${wave}. أعد المحاولة لتحسين نتيجتك.`;$('start').textContent='إعادة المهمة';$('overlay').classList.remove('hidden')}
function start(){reset();running=true;$('overlay').classList.add('hidden');toast('ابدأ الاشتباك — راقب الأهداف أمامك')}
$('start').addEventListener('click',start);
$('motion').addEventListener('click',async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('permission denied')}window.addEventListener('deviceorientation',e=>{if(e.gamma==null||e.beta==null)return;orientation.x=THREE.MathUtils.clamp(e.gamma/32,-1,1);orientation.y=THREE.MathUtils.clamp((e.beta-45)/35,-1,1)});motionEnabled=true;$('motion').textContent='تم تفعيل تحكم الحركة';toast('حرّك الهاتف للتوجيه')}catch(e){toast('لم يُسمح بحساس الحركة؛ استخدم السحب باللمس')}});
const pointer={down:false,x:0,y:0};renderer.domElement.addEventListener('pointerdown',e=>{pointer.down=true;pointer.x=e.clientX;pointer.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!pointer.down)return;aimX=THREE.MathUtils.clamp(aimX+(e.clientX-pointer.x)/innerWidth*2.3,-1,1);aimY=THREE.MathUtils.clamp(aimY-(e.clientY-pointer.y)/innerHeight*2.3,-.8,.8);pointer.x=e.clientX;pointer.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>pointer.down=false);renderer.domElement.addEventListener('pointercancel',()=>pointer.down=false);
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){fireHeld=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')fireHeld=false});$('fire').addEventListener('pointerdown',e=>{fireHeld=true;$('fire').setPointerCapture(e.pointerId)});$('fire').addEventListener('pointerup',()=>fireHeld=false);$('fire').addEventListener('pointercancel',()=>fireHeld=false);$('fire').addEventListener('lostpointercapture',()=>fireHeld=false);
const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);if(running){elapsed+=dt;if(elapsed>wave*24){wave++;toast('بدأت الموجة '+wave);updateHud()}let kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0);let tx=motionEnabled?orientation.x:aimX,ty=motionEnabled?orientation.y:aimY;let targetX=THREE.MathUtils.clamp(tx+kx*.75,-1,1),targetY=THREE.MathUtils.clamp(ty+ky*.75,-1,1);player.position.x=THREE.MathUtils.damp(player.position.x,targetX*13,3.5,dt);player.position.y=THREE.MathUtils.damp(player.position.y,2+targetY*6,3.5,dt);player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-targetX*.48,5,dt);player.rotation.x=THREE.MathUtils.damp(player.rotation.x,targetY*.16,4,dt);player.rotation.y=THREE.MathUtils.damp(player.rotation.y,-targetX*.12,4,dt);
fireTimer-=dt;if(fireHeld&&fireTimer<=0){shoot();fireTimer=.13}spawnTimer-=dt;if(spawnTimer<=0){enemy();spawnTimer=Math.max(.65,2.4-wave*.13)+Math.random()*.8}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.position.addScaledVector(b.userData.vel,dt);if(b.position.z< -140){scene.remove(b);bullets.splice(i,1);continue}for(let j=enemies.length-1;j>=0;j--){let en=enemies[j];if(b.position.distanceTo(en.position)<2.3){scene.remove(b);bullets.splice(i,1);en.userData.hp--;if(en.userData.hp<=0){burst(en.position);scene.remove(en);enemies.splice(j,1);score+=100;updateHud()}break}}}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.position.z+=e.userData.speed*dt;e.position.x+=Math.sin(elapsed*1.6+e.userData.phase)*dt*3;e.userData.fire-=dt;if(e.userData.fire<0&&e.position.z> -18){e.userData.fire=2.5;if(Math.abs(e.position.x-player.position.x)<8&&Math.random()<.5){hp=Math.max(0,hp-8);burst(player.position,0xff553f);updateHud();if(hp<=0){gameOver();break}}}if(e.position.z>7){scene.remove(e);enemies.splice(i,1);hp=Math.max(0,hp-12);updateHud();if(hp<=0){gameOver();break}}else if(e.position.distanceTo(player.position)<2.3){burst(e.position);scene.remove(e);enemies.splice(i,1);hp=Math.max(0,hp-18);updateHud();if(hp<=0){gameOver();break}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=8*dt;p.userData.life-=dt;p.scale.multiplyScalar(.985);p.material.opacity=Math.max(0,p.userData.life);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}
// Ocean and city districts drift to create continuous forward flight
sea.position.z=(elapsed*24)%240;for(const district of cityInstances){district.position.z+=24*dt;if(district.position.z>45)district.position.z-=840}
}
const camTarget=new THREE.Vector3(player.position.x*.34,player.position.y+2.2,player.position.z+10.5);camera.position.lerp(camTarget,1-Math.exp(-4*dt));camera.lookAt(player.position.x*.45,player.position.y+.1,-22);renderer.render(scene,camera)}tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script></body></html>
