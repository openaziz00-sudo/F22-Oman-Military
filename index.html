<!doctype html>

<style>
:root{--bg:#0d1115;--panel:rgba(20,26,32,.8);--line:#2c3740;--ink:#e6ecf1;--dim:#8c9aa6;--acc:#9ec1de;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{transition:opacity .2s}
.hide #ui{opacity:0;pointer-events:none}
header{position:fixed;top:0;inset-inline:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0 64px;pointer-events:none}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.credit{font-size:11px;opacity:.82}
footer{position:fixed;bottom:0;inset-inline:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
button,label.btn{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:inline-flex;align-items:center}
button[aria-pressed="true"],button.on{border-color:var(--acc);color:var(--acc)}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.feature-row{padding-bottom:2px}
.feature-row button{font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
#eye{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;z-index:11;width:44px;padding:0;justify-content:center;font-size:18px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="eye" aria-label="إخفاء أو إظهار الواجهة" title="إخفاء الواجهة">◐</button>
<noscript><main style="position:fixed;inset:0;padding:32px;background:#0d1115;color:#e6ecf1;font-family:system-ui,sans-serif"><h1>عارض F-22 Raptor ثلاثي الأبعاد</h1><p>يتطلب هذا العارض تفعيل JavaScript لعرض النموذج والتحكم بالكاميرا.</p><p>النموذج من Sketchfab، منشئه andertan، ومرخص بموجب CC-BY-4.0.</p></main></noscript>
<div id="ui">
  <header><h1>F-22 Raptor · تمويه عُماني صحراوي</h1><p>رملي وخردلي وبني ترابي مع بطن رمادي سماوي · <span id="tris"></span></p><p class="credit">النموذج: Sketchfab · andertan · CC-BY-4.0</p></header>
  <footer>

      <button id="auto" aria-pressed="true">دوران تلقائي</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const T=THREE, $=id=>document.getElementById(id);
const canvas=$('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=2.25;
renderer.shadowMap.enabled=true;
const scene=new T.Scene();
scene.background=new T.Color(0x111820);
scene.fog=new T.Fog(0x111820,45,95);
const camera=new T.PerspectiveCamera(38,1,.1,200);

/* بيئة انعكاسات استوديو */
const envS=new T.Scene();
envS.add(new T.Mesh(new T.SphereGeometry(50,24,12),new T.ShaderMaterial({side:T.BackSide,
 vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;void main(){float h=normalize(p).y;gl_FragColor=vec4(mix(vec3(.03,.04,.05),vec3(.34,.41,.49),smoothstep(-.2,1.,h)),1.);}'})));
function panel(x,y,z,w,h,i){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(i,i,i),side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);envS.add(m);}
panel(-20,25,15,30,12,6);panel(25,10,-20,14,30,4);panel(0,-5,30,40,6,1.5);
scene.environment=new T.PMREMGenerator(renderer).fromScene(envS,.02).texture;

/* إضاءة */
const key=new T.DirectionalLight(0xfff2e0,4.2);key.position.set(-10,14,12);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60});key.shadow.bias=-.0005;
const rim=new T.DirectionalLight(0x7fb0ff,2.6);rim.position.set(12,6,-14);
const fill=new T.DirectionalLight(0xd7e7f5,2.2);fill.position.set(0,18,20);
scene.add(key,rim,fill,new T.AmbientLight(0xc4d2df,1.45),new T.HemisphereLight(0xbad0e4,0x4f463c,1.35));
const floor=new T.Mesh(new T.CircleGeometry(30,64),new T.ShadowMaterial({opacity:.5}));
floor.rotation.x=-Math.PI/2;floor.position.y=-3.2;floor.receiveShadow=true;scene.add(floor);
const ring=new T.Mesh(new T.RingGeometry(13.8,14,96),new T.MeshBasicMaterial({color:0x2c3740,side:T.DoubleSide}));
ring.rotation.x=-Math.PI/2;ring.position.y=-3.19;scene.add(ring);

/* مواد */
const M={
 gold:new T.MeshBasicMaterial({color:0xa47716,side:T.DoubleSide}),
 paint:new T.MeshBasicMaterial({color:0x4d2d0b,side:T.DoubleSide}),
 camo:new T.MeshBasicMaterial({color:0x38200b,side:T.DoubleSide}),
 brown:new T.MeshBasicMaterial({color:0x1d1007,side:T.DoubleSide}),
 panel:new T.MeshBasicMaterial({color:0x27150a,side:T.DoubleSide}),
 under:new T.MeshBasicMaterial({color:0x4d7188,side:T.DoubleSide}),
 dark:new T.MeshBasicMaterial({color:0x252b31,side:T.DoubleSide}),
 glass:new T.MeshBasicMaterial({color:0x0d2f49,transparent:true,opacity:.88,side:T.DoubleSide}),
 noz:new T.MeshBasicMaterial({color:0x69645b,side:T.DoubleSide}),
 hole:new T.MeshBasicMaterial({color:0x040506,side:T.DoubleSide})
};

/* هندسة */
function loft(secs,Mn,p){
 const pos=[],idx=[];
 secs.forEach(s=>{for(let j=0;j<Mn;j++){const a=j/Mn*Math.PI*2,c=Math.cos(a),sn=Math.sin(a);
  const h=sn>=0?s[2]:s[3];
  pos.push(s[1]*Math.sign(c)*Math.pow(Math.abs(c),p),s[4]+h*Math.sign(sn)*Math.pow(Math.abs(sn),p),s[0]);}});
 for(let i=0;i<secs.length-1;i++)for(let j=0;j<Mn;j++){
  const a=i*Mn+j,b=i*Mn+(j+1)%Mn,c=(i+1)*Mn+j,d=(i+1)*Mn+(j+1)%Mn;idx.push(a,c,b,b,c,d);}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
function plan(pts,th){
 const s=new T.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));s.closePath();
 return new T.ExtrudeGeometry(s,{depth:th,bevelEnabled:true,bevelThickness:.03,bevelSize:.04,bevelSegments:1});
}
let jet;
let featureRig=null;
function buildJet(){
 const g=new T.Group();
 const rig={doors:[],canopy:null,chute:null,state:{doors:0,canopy:0,chute:0},target:{doors:0,canopy:0,chute:0}};
 featureRig=rig;
 const add=(m,mirror)=>{m.castShadow=true;g.add(m);if(mirror){const c=m.clone();c.position.x*=-1;c.scale.x*=-1;g.add(c);}return m;};
 // جسم الطائرة
 const nosePanel=new T.Mesh(new T.BoxGeometry(.34,.035,2.4),M.gold);nosePanel.position.set(0,.53,7.0);nosePanel.rotation.y=.04;g.add(nosePanel);
 const fuselage=new T.Mesh(loft([[9.6,.02,.02,.02,.05],[9,.25,.18,.14,.05],[7.8,.55,.35,.28,.08],[6.2,.9,.5,.4,.1],[4,1.25,.7,.5,.12],[1,1.7,.75,.55,.1],[-3,1.85,.75,.55,.1],[-7,1.6,.65,.5,.08],[-9,1.45,.55,.45,.05],[-9.1,.1,.1,.1,.05]],28,2.6),M.paint);add(fuselage);
 // شريط بني ترابي منخفض على جانبي البدن ضمن نمط التمويه.
 [-1,1].forEach(side=>{const band=new T.Mesh(new T.BoxGeometry(.16,.08,4.6),M.brown);band.position.set(side*1.2,.72,-1.15);band.rotation.y=side*.08;g.add(band);});
 // الأجنحة
 const wingShape=[[1,2.5],[6.78,-2.6],[6.78,-4.1],[1,-5.8]];
 const w=new T.Mesh(plan(wingShape,.1).rotateX(Math.PI/2),M.paint);w.position.y=-.02;add(w,true);
 // بطن الجناح الرمادي السماوي للاندماج مع لون السماء عند النظر من الأسفل.
 const wu=new T.Mesh(plan(wingShape,.035).rotateX(Math.PI/2),M.under);wu.position.y=-.14;add(wu,true);
 // تمويه صحراوي متكسر: بقع بنية كبيرة مع شرائط مائلة خردلية كما في المرجع.
 function camoPatch(x,y,z,w,l,angle,mat=M.brown){
   const patch=new T.Mesh(new T.BoxGeometry(w,.045,l),mat);patch.position.set(x,y,z);patch.rotation.y=angle;g.add(patch);return patch;
 }
 // بقع طويلة على ظهر البدن تكسر الخط المستقيم للطائرة.
 camoPatch(0,.84,2.0,.62,2.5,-.16);
 camoPatch(-.38,.82,-.65,.58,2.2,.42);
 camoPatch(.42,.82,-3.05,.72,2.7,-.28);
 camoPatch(-.28,.72,-5.7,.5,1.8,.22);
 // كتل بنية متداخلة على الأجنحة والذيل.
 [-1,1].forEach(side=>{
   const patches=[
     [2.05,-.02,-1.65,.42,2.25,side*.5],
     [3.0,.02,-2.95,.5,1.9,-side*.34],
     [4.12,.03,-4.0,.38,1.25,side*.62],
     [1.52,.72,.85,.42,1.65,-side*.36]
   ];
   patches.forEach(p=>camoPatch(side*p[0],p[1],p[2],p[3],p[4],p[5]));
   // شريط خردلي فاتح داخل بعض البقع ليوحي بتمويه الطائرات الصحراوية القديمة.
   camoPatch(side*2.75,.12,-1.55,.12,1.55,-side*.55,M.camo);
   camoPatch(side*4.0,.12,-3.3,.1,1.0,side*.48,M.camo);
 });
 // المثبتات الأفقية
 const s=new T.Mesh(plan([[1.4,-4.6],[4.3,-8],[4.3,-9.3],[1.4,-8.6]],.08).rotateX(Math.PI/2),M.paint);s.position.y=.05;add(s,true);
 const su=new T.Mesh(plan([[1.4,-4.6],[4.3,-8],[4.3,-9.3],[1.4,-8.6]],.025).rotateX(Math.PI/2),M.under);su.position.y=-.08;add(su,true);
 // الذيل المزدوج المائل
 const f=new T.Mesh(plan([[3.8,0],[6.6,2.6],[8,2.6],[8.6,0]],.08).translate(0,0,-.04).rotateY(Math.PI/2).rotateZ(-.47),M.paint);f.position.set(1.5,.7,0);add(f,true);
 // مداخل الهواء
 const it=new T.Mesh(loft([[5.2,.42,.42,.42,-.15],[3.5,.5,.5,.45,-.15],[1,.6,.55,.5,-.12]],20,2.2),M.dark);it.position.x=1.3;add(it,true);
 const mo=new T.Mesh(new T.CircleGeometry(1,24),M.hole);mo.scale.set(.4,.4,1);mo.position.set(1.3,-.15,5.22);add(mo,true);
 // المحركات
 const n=new T.Mesh(new T.CylinderGeometry(.62,.48,1.6,24,1,true).rotateX(Math.PI/2),M.noz);n.position.set(.95,.05,-9.4);add(n,true);
 const nh=new T.Mesh(new T.CircleGeometry(.46,24),M.hole);nh.position.set(.95,.05,-9.25);add(nh,true);
 // أبواب حجرة التسليح السفلية: تفتح للخارج بحركة مفصلية.
 const bay=new T.Mesh(new T.BoxGeometry(1.15,.12,3.1),M.hole);bay.position.set(0,-.68,.35);g.add(bay);
 [-1,1].forEach(side=>{
   const door=new T.Group();
   const panel=new T.Mesh(new T.BoxGeometry(.62,.08,3.1),M.panel);panel.position.x=side*.3;door.add(panel);
   door.position.set(side*.48,-.75,.35);door.userData.side=side;g.add(door);rig.doors.push(door);
 });
 // القمرة الزجاجية الداكنة مع إطار سفلي، وترتفع عند فتحها.
 const canopyGroup=new T.Group();
 const c=new T.Mesh(new T.SphereGeometry(1,28,18),M.glass);c.scale.set(.55,.42,2);c.position.set(0,.8,5.2);canopyGroup.add(c);
 const canopyFrame=new T.Mesh(new T.BoxGeometry(.9,.06,1.7),M.panel);canopyFrame.position.set(0,.5,5.2);canopyGroup.add(canopyFrame);
 g.add(canopyGroup);rig.canopy=canopyGroup;
 // مظلة كبح قابلة للفتح خلف المحركات.
 const chute=new T.Group();
 const canopy=new T.Mesh(new T.SphereGeometry(1.05,24,12,0,Math.PI*2,0,Math.PI/2),new T.MeshBasicMaterial({color:0xb72e35,side:T.DoubleSide}));
 canopy.scale.set(1,.55,1);canopy.position.set(0,.2,-10.25);chute.add(canopy);
 const strapMat=new T.MeshBasicMaterial({color:0xe9e5d4});
 [-.6,0,.6].forEach(x=>{const strap=new T.Mesh(new T.CylinderGeometry(.018,.018,1.8,8),strapMat);strap.rotation.z=x*.35;strap.position.set(x*.35,-.25,-10.05);chute.add(strap);});
 chute.scale.setScalar(.001);g.add(chute);rig.chute=chute;
 // خطوط ألواح وصيانة دقيقة على السطح العلوي للأجنحة
 const seamMat=new T.LineBasicMaterial({color:0x303827,transparent:true,opacity:.78});
 const seams=[[-5.9,-3.7,1.1,-.1],[-5.1,-2.8,1.2,.2],[-4.1,-1.8,1.2,.5],[-3.2,-.8,1.2,.8]];
 seams.forEach((a)=>[-1,1].forEach(side=>{const pts=[new T.Vector3(side*a[0],.045,a[1]),new T.Vector3(side*a[2],.045,a[3])];const line=new T.Line(new T.BufferGeometry().setFromPoints(pts),seamMat);g.add(line);}));
 // فتحات تهوية صغيرة وتفاصيل صيانة على جانبي البدن
 for(let side of [-1,1]){
   for(let i=0;i<5;i++){const vent=new T.Mesh(new T.BoxGeometry(.025,.025,.42),M.panel);vent.position.set(side*(1.62-i*.035),.63,1.7-i*.48);g.add(vent);}
   // شارة عسكرية ثلاثية الحلقات بألوان عُمان على جانبي البدن.
   const roundelGroup=new T.Group();
   const roundelSpecs=[[.24,0xb52d32],[.17,0xf0eee2],[.10,0x177a4b]];
   roundelSpecs.forEach(([r,color])=>roundelGroup.add(new T.Mesh(new T.CircleGeometry(r,32),new T.MeshBasicMaterial({color,side:T.DoubleSide}))));
   roundelGroup.position.set(side*1.48,.79,-2.1);roundelGroup.rotation.y=side*Math.PI/2;g.add(roundelGroup);
   // لوحة صيانة داكنة مع خط تحذير فاتح أسفلها.
   const service=new T.Mesh(new T.PlaneGeometry(.56,.18),M.panel);
   service.position.set(side*1.49,.67,-.15);service.rotation.y=side*Math.PI/2;g.add(service);
   const warning=new T.Mesh(new T.PlaneGeometry(.46,.018),new T.MeshBasicMaterial({color:0xd9c98b,side:T.DoubleSide}));
   warning.position.set(side*1.505,.67,.12);warning.rotation.y=side*Math.PI/2;g.add(warning);
 }
 // علم سلطنة عُمان على جانبي الذيل: الأبيض والأحمر والأخضر مع الشريط الأحمر الرأسي
 function omanFlagTexture(){
   const c=document.createElement('canvas');c.width=300;c.height=150;const x=c.getContext('2d');
   x.fillStyle='#ffffff';x.fillRect(0,0,300,50);x.fillStyle='#d22630';x.fillRect(0,50,300,50);x.fillStyle='#008000';x.fillRect(0,100,300,50);x.fillStyle='#d22630';x.fillRect(0,0,62,150);
   // شارة مبسطة مستوحاة من شعار الخنجر والسيفين
   x.strokeStyle='#ffffff';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(18,35);x.lineTo(42,115);x.moveTo(44,35);x.lineTo(20,115);x.stroke();
   x.fillStyle='#ffffff';x.beginPath();x.moveTo(22,67);x.quadraticCurveTo(31,52,40,67);x.lineTo(38,88);x.quadraticCurveTo(31,99,24,88);x.closePath();x.fill();
   const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t;
 }
 const flagMat=new T.MeshBasicMaterial({map:omanFlagTexture(),side:T.DoubleSide});
 [-1,1].forEach(side=>{const flag=new T.Mesh(new T.PlaneGeometry(.92,.46),flagMat);flag.position.set(side*1.58,1.45,1.25);flag.rotation.y=side*Math.PI/2;g.add(flag);});
 // أرقام تعريف صغيرة وعلامات تحذير قرب مداخل الهواء
 const stencil=new T.MeshBasicMaterial({color:0xd2d0b8,side:T.DoubleSide});
 [-1,1].forEach(side=>{const mark=new T.Mesh(new T.PlaneGeometry(.36,.12),stencil);mark.position.set(side*1.55,.35,3.1);mark.rotation.y=side*Math.PI/2;g.add(mark);});
 // أنبوب بيتو
 const p=new T.Mesh(new T.CylinderGeometry(.02,.03,1.4,8).rotateX(Math.PI/2),M.dark);p.position.set(0,.05,10.2);add(p);
 return g;
}
function countTris(o){let n=0;o.traverse(m=>{if(m.isMesh){const gg=m.geometry;n+=(gg.index?gg.index.count:gg.attributes.position.count)/3;}});return Math.round(n);}
function setJet(o){
 if(jet)scene.remove(jet);jet=o;scene.add(jet);
 $('tris').textContent='مثلثات: '+countTris(jet).toLocaleString('en');
 applyWire();
 const hasRig=Boolean(featureRig&&featureRig.canopy&&featureRig.chute);
 ['doors','canopy','chute'].forEach(id=>$(id).disabled=!hasRig);
}
let wire=false;
function applyWire(){jet.traverse(m=>{if(m.isMesh){(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.wireframe=wire);}});}
setJet(buildJet());
function makeRealFeatureRig(root){
 const rig={doors:[],canopy:null,chute:null,state:{doors:0,canopy:0,chute:0},target:{doors:0,canopy:0,chute:0}};
 // حجرة تسليح واقعية أسفل مركز البدن: بابان رقيقان مع مفصلات وأضلاع تقوية.
 const bay=new T.Mesh(new T.BoxGeometry(4.8,.16,1.25),new T.MeshBasicMaterial({color:0x17191b,side:T.DoubleSide}));bay.position.set(0,-1.28,0);root.add(bay);
 [-1,1].forEach(side=>{
   const door=new T.Group();door.userData.side=side;
   const panel=new T.Mesh(new T.BoxGeometry(4.8,.12,.56),new T.MeshBasicMaterial({color:0x3f2818,side:T.DoubleSide}));panel.position.z=side*.3;door.add(panel);
   for(let x=-1.7;x<=1.7;x+=.85){const rib=new T.Mesh(new T.BoxGeometry(.07,.08,.48),new T.MeshBasicMaterial({color:0x17100b}));rib.position.set(x,0,side*.31);door.add(rib);}
   const hinge=new T.Mesh(new T.CylinderGeometry(.09,.09,4.7,12),new T.MeshBasicMaterial({color:0x4b4033}));hinge.rotation.z=Math.PI/2;hinge.position.set(0,.02,side*.58);door.add(hinge);
   door.position.set(0,-1.35,0);root.add(door);rig.doors.push(door);
 });
 // قمره شفافة مفصلية فوق موضع القيادة، تتحرك للخلف عند الفتح.
 const canopy=new T.Group();
 const shell=new T.Mesh(new T.SphereGeometry(1,24,14),new T.MeshBasicMaterial({color:0x1d4a63,transparent:true,opacity:.28,side:T.DoubleSide}));shell.scale.set(.72,.24,.58);shell.position.set(-3.4,.18,0);canopy.add(shell);
 const frame=new T.Mesh(new T.BoxGeometry(2.5,.07,.08),new T.MeshBasicMaterial({color:0x2b2119}));frame.position.set(-3.4,.03,0);canopy.add(frame);
 canopy.scale.setScalar(.001);root.add(canopy);rig.canopy=canopy;
 // مظلة كبح واقعية نسبيًا خلف الذيل، مخفية حتى الفتح.
 const chute=new T.Group();
 const dome=new T.Mesh(new T.SphereGeometry(1.2,28,16,0,Math.PI*2,0,Math.PI/2),new T.MeshBasicMaterial({color:0xb08025,side:T.DoubleSide}));dome.scale.set(1,.58,1);dome.position.set(-8.6,.55,0);chute.add(dome);
 [-.65,0,.65].forEach(z=>{const cord=new T.Mesh(new T.CylinderGeometry(.018,.018,2.1,8),new T.MeshBasicMaterial({color:0xe8dfc8}));cord.rotation.z=.22;cord.position.set(-8.15,.0,z*.35);chute.add(cord);});
 chute.scale.setScalar(.001);root.add(chute);rig.chute=chute;
 return rig;
}
function adoptGLTF(gl){
 const o=gl.scene,b=new T.Box3().setFromObject(gl.scene),sz=b.getSize(new T.Vector3()),ct=b.getCenter(new T.Vector3());
 const k=19/Math.max(sz.x,sz.y,sz.z);const wrap=new T.Group();o.position.sub(ct);wrap.add(o);wrap.scale.setScalar(k);
 wrap.traverse(m=>{if(m.isMesh){m.castShadow=true;const mats=Array.isArray(m.material)?m.material:[m.material];
   const converted=mats.map(x=>{const n=(x.name||'').toLowerCase();const glass=n.includes('glass')||n.includes('screen');const dark=n.includes('dark')||n.includes('black')||n.includes('darkness')||n==='grey';const camoPatch=(m.id%5===0||m.id%7===0);const c=glass?0x0b334d:(dark?0x1d0d05:(camoPatch?0x251108:0x4a2a0b));
     return new T.MeshBasicMaterial({map:x.map||null,color:c,transparent:Boolean(x.transparent)||glass,opacity:x.opacity==null?(glass?.88:1):x.opacity,side:T.DoubleSide,depthWrite:!glass});
   });
   m.material=Array.isArray(m.material)?converted:converted[0];
 }});featureRig=makeRealFeatureRig(wrap);setJet(wrap);
}
/* النموذج الواقعي المرفق هو العرض الافتراضي، مع بقاء الاستيراد اليدوي متاحًا. */
new T.GLTFLoader().load('lockheed_martin_f-22_raptor.glb',adoptGLTF,undefined,()=>{});

/* التحكم */
const controls=new T.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=false;
controls.minDistance=4;controls.maxDistance=60;controls.autoRotate=true;controls.autoRotateSpeed=1.2;
const VIEWS={
 'ثلاثي الأرباع':[[.62,.3,.72],30,[0,0,0]],
 'أمامية':[[0,.12,1],30,[0,0,0]],
 'خلفية':[[0,.12,-1],30,[0,0,0]],
 'جانبية':[[1,.05,0],32,[0,0,0]],
 'علوية':[[0,1,.001],30,[0,0,0]],
 'سفلية':[[0,-1,.001],30,[0,0,0]],
 'المحركات':[[.4,.15,-1],7,[0,0,-9]],
 'القمرة':[[.8,.35,.7],5,[0,.9,5.2]],
 'الجناح':[[.4,.7,.5],8,[4.5,-.1,-2]]
};
let tween=null;
function goTo(name,instant){
 const v=VIEWS[name],asp=camera.aspect,fit=v[1]>10?Math.max(1,1.1/asp):1;
 const d=new T.Vector3(...v[0]).normalize().multiplyScalar(v[1]*fit);
 const tt=new T.Vector3(...v[2]),pp=tt.clone().add(d);
	 if(instant){camera.position.copy(pp);controls.target.copy(tt);controls.update();return;}
	 tween={startTime:performance.now(),dur:900,p0:camera.position.clone(),startTarget:controls.target.clone(),p1:pp,t1:tt};
}
const vb=$('views');
Object.keys(VIEWS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>goTo(k);vb.appendChild(b);});
$('reset').onclick=()=>goTo('ثلاثي الأرباع');
function toggleFeature(name,label){
 if(!featureRig)return;
 featureRig.target[name]=featureRig.target[name]>.5?0:1;
 const open=featureRig.target[name]>.5;
 const b=$(name);b.setAttribute('aria-pressed',open);b.textContent=label+(open?' · إغلاق':'');
}
$('doors').onclick=()=>toggleFeature('doors','فتح أبواب التسليح');
$('canopy').onclick=()=>toggleFeature('canopy','رفع القمرة');
$('chute').onclick=()=>toggleFeature('chute','فتح المظلة');
$('auto').onclick=function(){controls.autoRotate=!controls.autoRotate;this.setAttribute('aria-pressed',controls.autoRotate);};
$('wire').onclick=function(){wire=!wire;this.setAttribute('aria-pressed',wire);applyWire();};
$('eye').onclick=()=>document.body.classList.toggle('hide');
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>new T.GLTFLoader().parse(r.result,'',adoptGLTF,()=>alert('تعذر قراءة ملف GLB. تأكد أنه ملف صالح ومضمّن الخامات.'));
 r.readAsArrayBuffer(f);
};

/* منع الاختراق: العودة لآخر موضع سليم */
function inside(p){return(Math.abs(p.x)<2.3&&Math.abs(p.y)<1.5&&Math.abs(p.z)<10)||(Math.abs(p.x)<7.2&&p.y>-.4&&p.y<.3&&p.z>-6.2&&p.z<2.8);}
let prev=new T.Vector3();
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();goTo('ثلاثي الأرباع',true);prev.copy(camera.position);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let lastFrame=performance.now();
function updateFeatures(dt){
 if(!featureRig)return;
 const r=featureRig;
 ['doors','canopy','chute'].forEach(k=>r.state[k]+=(r.target[k]-r.state[k])*Math.min(1,dt*7));
 r.doors.forEach((door,i)=>{const side=door.userData.side;door.rotation.z=side*r.state.doors*.82;});
 r.canopy.position.y=r.state.canopy*.7;r.canopy.rotation.x=-r.state.canopy*.12;r.canopy.scale.setScalar(Math.max(.001,r.state.canopy));
 r.chute.scale.setScalar(Math.max(.001,r.state.chute));
}
renderer.setAnimationLoop(()=>{
	 const now=performance.now(),dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;updateFeatures(dt);
	 if(tween){const t=Math.min(1,(performance.now()-tween.startTime)/tween.dur),k=ease(t);
	  camera.position.lerpVectors(tween.p0,tween.p1,k);controls.target.lerpVectors(tween.startTarget,tween.t1,k);if(t>=1)tween=null;}
 controls.update();
 if(inside(camera.position))camera.position.copy(prev);else prev.copy(camera.position);
 renderer.render(scene,camera);
});
})();
</script>
</body>
</html>
